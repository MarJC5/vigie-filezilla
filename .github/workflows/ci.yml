name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Vigie's repository is private: its module is fetched directly, with a read-only token of the
# repository secrets (VIGIE_READ_TOKEN: Contents read on MarJC5/vigie only).
env:
  GOPRIVATE: github.com/MarJC5/*

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, tests, vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Read access to Vigie's module
        run: git config --global url."https://x-access-token:${{ secrets.VIGIE_READ_TOKEN }}@github.com/MarJC5/vigie".insteadOf "https://github.com/MarJC5/vigie"
      - run: make check
